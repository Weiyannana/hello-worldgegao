<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一封给你的表白信</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            max-width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #f9c5d1 0%, #f5b0cb 25%, #c2b0f5 75%, #a5c5f5 100%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* 爱心背景装饰 */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.2);
            font-size: 20px;
            animation: float 8s linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .page-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 页面一 */
        .page-one {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 30px 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            margin-bottom: 30px;
            position: relative;
        }

        .header h1 {
            color: #ff6b93;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .header p {
            color: #888;
            font-size: 1.1rem;
            font-weight: 300;
        }

        .profile-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            padding: 15px;
            background: linear-gradient(to right, #ffeff6, #f0f3ff);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(255, 107, 147, 0.15);
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            margin-right: 20px;
        }

        .profile-text {
            text-align: left;
            max-width: 220px;
        }

        .profile-text h2 {
            color: #ff6b93;
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .profile-text p {
            color: #666;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .question-section {
            margin: 30px 0;
            padding: 20px;
            background: linear-gradient(135deg, #ff9bc9, #ffd6e7);
            border-radius: 18px;
            color: #fff;
            box-shadow: 0 8px 20px rgba(255, 107, 147, 0.2);
        }

        .question-section h3 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .question-section p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        .love-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            }
            50% {
                box-shadow: 0 10px 30px rgba(255, 107, 147, 0.4);
            }
            100% {
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            }
        }

        .yes-btn {
            background: linear-gradient(135deg, #ff6b93, #ff8fab);
        }

        .no-btn {
            background: linear-gradient(135deg, #36d1dc, #5b86e5);
        }

        .love-btn:hover {
            transform: scale(1.05);
        }

        .love-btn:active {
            transform: scale(0.98);
        }

        .love-btn span {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
        }

        .love-btn i {
            font-size: 2.5rem;
            margin-bottom: 8px;
            display: block;
        }

        /* 页面二 */
        .page-two {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 40px 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            display: none;
            animation: fadeInUp 0.8s ease-out;
        }

        .love-letter {
            padding: 20px;
            background: linear-gradient(to right, #fff9fb, #f9f9ff);
            border-radius: 18px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .typewriter-text {
            font-size: 1.3rem;
            line-height: 1.8;
            color: #555;
            text-align: left;
            min-height: 200px;
            padding: 10px;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.3rem;
            background-color: #ff6b93;
            margin-left: 2px;
            animation: blink 0.7s infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .next-btn {
            background: linear-gradient(135deg, #ff6b93, #ff8fab);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 107, 147, 0.3);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0 auto;
        }

        .next-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(255, 107, 147, 0.4);
        }

        .next-btn:active {
            transform: translateY(0);
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 35px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            transform: translateY(30px);
            transition: transform 0.4s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-content h3 {
            color: #ff6b93;
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .modal-content p {
            color: #555;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .modal-btn {
            background: linear-gradient(135deg, #ff6b93, #ff8fab);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 107, 147, 0.3);
            font-weight: 600;
            margin: 0 auto;
            display: block;
        }

        .modal-btn:hover {
            transform: scale(1.05);
        }

        /* 响应式调整 */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .profile-container {
                flex-direction: column;
                text-align: center;
            }
            
            .profile-img {
                margin-right: 0;
                margin-bottom: 15px;
            }
            
            .profile-text {
                text-align: center;
                max-width: 100%;
            }
            
            .buttons-container {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            
            .love-btn {
                width: 130px;
                height: 130px;
            }
            
            .typewriter-text {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- 爱心背景 -->
    <div class="hearts-bg" id="heartsBg"></div>
    
    <!-- 页面一：表白 -->
    <div class="page-container">
        <div class="page-one" id="pageOne">
            <div class="header">
                <h1>❤️ 致最爱的你 ❤️</h1>
                <p>请打开这封特别的信...</p>
            </div>
            
            <div class="profile-container">
                <img src="./img/3a7b7ea624a1949a9e3d5ef8e5aa9bb4.jpg" alt="你的照片" class="profile-img">
                <div class="profile-text">
                    <h2>亲爱的常艺潇</h2>
                    <p>遇见你是我一生中最美丽的意外</p>
                </div>
            </div>
            
            <div class="question-section">
                <h3>我有话想对你说...</h3>
                <p>我喜欢你很久了，你愿意做我的女朋友吗？</p>
            </div>
            
            <div class="buttons-container">
                <div class="love-btn yes-btn" id="yesBtn">
                    <div>
                        <i class="fas fa-heart"></i>
                        <span>我愿意</span>
                    </div>
                </div>
                <div class="love-btn no-btn" id="noBtn">
                    <div>
                        <i class="fas fa-heart-broken"></i>
                        <span>不愿意</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 页面二：情书 -->
        <div class="page-two" id="pageTwo">
            <div class="header">
                <h1>💌 写给你的情书 💌</h1>
                <p>我的心里话...</p>
            </div>
            
            <div class="love-letter">
                <div class="typewriter-text" id="typewriterText"></div>
            </div>
            
            <button class="next-btn" id="nextPageBtn">
                <span>开启我们的故事</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>
    
    <!-- 模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3 id="modalTitle">提示</h3>
            <p id="modalMessage"></p>
            <button class="modal-btn" id="modalConfirmBtn">确定</button>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // 创建爱心背景
            createHearts();
            
            // 愿意按钮点击事件
            $('#yesBtn').click(function() {
                showModal('太好了！❤️', '我就知道你会答应的！从今以后，让我好好珍惜你、爱护你，好吗？', function() {
                    // 显示第二页
                    $('#pageOne').hide();
                    $('#pageTwo').show();
                    
                    // 开始打字机效果
                    typeWriterEffect();
                });
            });
            
            // 不愿意按钮点击事件 - 一系列对话
            $('#noBtn').click(function() {
                showModal('真的吗？😢', '你真的忍心拒绝我吗？', function() {
                    showModal('再考虑一下嘛', '我知道你可能还没准备好，但我是真心的！', function() {
                        showModal('我喜欢你！', '这句话在我心里藏了很久很久...', function() {
                            showModal('请给我一个机会', '让我证明我对你的感情是认真的', function() {
                                showModal('我会一直等你', '直到你愿意接受我的那一天', function() {
                                    showModal('跟我走吧', '我想带你去看遍世间的美好', function() {
                                        showModal('房产证写你名', '我的未来计划里全都有你', function() {
                                            showModal('我会做饭做家务', '把你宠成世界上最幸福的人', function() {
                                                showModal('行，我们去民政局登记吧', '哈哈哈，开玩笑的！但我的心意是真的❤️', function() {
                                                    // 显示第二页
                                                    $('#pageOne').hide();
                                                    $('#pageTwo').show();
                                                    
                                                    // 开始打字机效果
                                                    typeWriterEffect();
                                                });
                                            });
                                        });
                                    });
                                });
                            });
                        });
                    });
                });
            });
            
            // 下一页按钮点击事件
            $('#nextPageBtn').click(function() {
                showModal('开启新篇章', '我们的故事才刚刚开始...', function() {
                    // 在实际使用中，这里可以跳转到其他页面
                    // window.location.href = "love-story.html";
                    
                    // 这里我们简单显示一个提示
                    // showModal('', '这是一个页面。如果是真实的表白，这里会跳转到记录我们故事的专属页面。祝您表白成功！❤️');
                });
            });
            
            // 模态框确认按钮点击事件
            $('#modalConfirmBtn').click(function() {
                $('#modalOverlay').removeClass('active');
            });
            
            // 打字机效果
            function typeWriterEffect() {
                const text = `亲爱的常艺潇：

有人说，人的一生会遇到2920万人，而两个人相爱的概率只有0.000049。在这茫茫人海中，两个人能相遇就值得感激，能相爱更是一种难得的缘分。

我很庆幸上天让我遇见了你。你的笑容像阳光一样温暖，你的眼睛像星辰一样明亮。和你在一起的每一刻，我都感到无比幸福。

如果可以，我希望陪你去所有你喜欢的地方，陪你看遍世间的美景，陪你度过每一个平凡而珍贵的日子。我想牵着你的手，走过春夏秋冬，直到白发苍苍。

我爱你，直到永远。
我们的故事，永远不会结束...

❤️ 永远爱你的我 ❤️`;
                
                let index = 0;
                const speed = 50; // 打字速度（毫秒）
                const typewriterElement = $('#typewriterText');
                
                function typeWriter() {
                    if (index < text.length) {
                        // 添加光标
                        let currentText = text.substring(0, index + 1);
                        typewriterElement.html(currentText + '<span class="cursor"></span>');
                        index++;
                        setTimeout(typeWriter, speed);
                    } else {
                        // 打字完成后移除光标
                        typewriterElement.html(text);
                    }
                }
                
                // 开始打字效果
                setTimeout(typeWriter, 500);
            }
            
            // 创建爱心背景
            function createHearts() {
                const heartsBg = $('#heartsBg');
                const heartCount = 15;
                
                for (let i = 0; i < heartCount; i++) {
                    const heart = $('<div class="heart"><i class="fas fa-heart"></i></div>');
                    
                    // 随机位置
                    const leftPos = Math.random() * 100;
                    const delay = Math.random() * 8;
                    const size = 15 + Math.random() * 20;
                    
                    heart.css({
                        left: leftPos + '%',
                        fontSize: size + 'px',
                        animationDelay: delay + 's'
                    });
                    
                    heartsBg.append(heart);
                }
            }
            
            // 显示模态框函数
            function showModal(title, message, callback) {
                $('#modalTitle').text(title);
                $('#modalMessage').text(message);
                $('#modalOverlay').addClass('active');
                
                // 设置确认按钮的回调
                $('#modalConfirmBtn').off('click').on('click', function() {
                    $('#modalOverlay').removeClass('active');
                    if (callback && typeof callback === 'function') {
                        setTimeout(callback, 300);
                    }
                });
            }
            
            // 页面加载时的动画效果
            setTimeout(function() {
                $('#pageOne').css('animation', 'fadeInUp 0.8s ease-out');
            }, 100);
        });
    </script>
</body>
</html>
